name: Finalize exact Grain Fields upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-grain-fields-upload]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact README files
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/README.md.00.b64 \
              .upload/README.md.01-02.b64 \
              .upload/README.md.03.p0.b64 \
              .upload/README.md.03.p1.b64 \
              .upload/README.md.04.b64 \
              .upload/README.md.05-only.b64 \
            | base64 -d | gzip -d > README.md

          cat .upload/README.en.md.00-01.b64 \
              .upload/README.en.md.02-03.b64 \
              .upload/README.en.md.04.p0.b64 \
              .upload/README.en.md.04.p1.b64 \
              .upload/README.en.md.05.p0.b64 \
              .upload/README.en.md.05.p1.b64 \
            | base64 -d | gzip -d > README.en.md

          echo "2dbb218fe17fbc3ff13cb984f8332cbfaf2ebf4dd5faa3b5ec88437771be8052  README.md" | sha256sum -c -
          echo "dbe476cf3be9c3ec24bfc57cff7d8bc2ca857212412e4d56d0673bfdb6b594e0  README.en.md" | sha256sum -c -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git commit -m "chore: reconstruct exact README files"
          git push origin HEAD:main
