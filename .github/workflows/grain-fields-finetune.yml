name: Grain Fields requested fine-tune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grain-fields-finetune.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact requested skill patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          data = ''''''
          open('/tmp/grain-fields.patch','wb').write(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/grain-fields.patch
          git apply /tmp/grain-fields.patch
          python - <<'PY'
          import subprocess
          expected = {
            'SKILL.md':'7dd43820fec6672d353b1f0471628aad91a61b67',
            'references/00-style-core.md':'dc2aa1282f72f7f599a89d819c3b269d664a5601',
            'references/01-scene-analysis.md':'20a18fb3d34a3394ae52520a6783a6203ef3a818',
            'references/02-transformation.md':'4bc35b93de59795a3ec74f91a040b3fe52a53b3a',
            'references/03-art-direction.md':'21fd6214a783956755e973a1c71fa035d4b8759b',
            'references/04-generation-compiler.md':'e21d599aadb21ff874e0c2f1c3c716acc845bc9c',
            'references/05-quality-control.md':'d654d2f77783e05b52edd9b4c31a61ba2005c2f9',
          }
          for path, want in expected.items():
              got = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if got != want:
                  raise SystemExit(f'{path}: {got} != {want}')
          PY
          rm -f .github/workflows/grain-fields-finetune.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'autainmo'
          git config user.email '127984497+autainmo@users.noreply.github.com'
          git add -A
          git commit -m 'refine: strengthen grain visibility and subject preservation'
          git push origin HEAD:main
