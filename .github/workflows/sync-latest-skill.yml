name: Sync latest Grain Fields skill

on:
  push:
    paths:
      - .github/workflows/sync-latest-skill.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact skill patch
        shell: bash
        run: |
          cat .github/syncparts/part*.b64 | tr -d '\n' | base64 -d > /tmp/grain.patch
          git apply --check /tmp/grain.patch
          git apply /tmp/grain.patch
          rm -rf .github/syncparts .github/workflows/sync-latest-skill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine: randomize distinct palettes and text types"
          git push origin HEAD:main
# rerun after exact patch-chunk verification
