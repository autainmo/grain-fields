name: Restore v1.1.1 snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore large files
        shell: bash
        run: |
          cat .restore/readme.0 .restore/readme.1 .restore/readme.2 | base64 -d | xz -d > README.md
          mkdir -p references
          cat .restore/art.0 .restore/art.1 .restore/art.2 | base64 -d | xz -d > references/03-art-direction.md
          rm -rf .restore
          rm -f .github/workflows/restore-v111.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore: finalize v1.1.1 snapshot" || exit 0
          git push
