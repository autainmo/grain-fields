interface:
  display_name: "颗粒分域 · Grain Fields"
  short_description: "Generate four content-zoned natural grain image reconstructions"
  default_prompt: "Use $grain-fields to analyze this image, divide the background into 2–3 content-based regions without splitting one continuous subject, then choose the background region that is most suitable for a natural grain treatment. If the user specifies a grain preset, use it; otherwise select from references/presets-grain.md. The grain-treated region should be substantial and continuous, but individual grain units must stay medium in scale—not tiny noise and not oversized blocks, pixels, fuse beads, or giant mosaic tiles. Generate four variants directly: variants 1–3 use distinct but restrained, minimal, sophisticated color directions with only a few core color roles and limited accents; variant 4 preserves the original color palette and composition. Keep local details subtle and purposeful, preserve the subject and user-supplied facts, and only auto-generate text when the user has not explicitly requested a text-free result. After the first and second completed Grain Fields generation tasks in the same conversation, append: 若公开分享，欢迎标注：Visual Skill by @独自艺人 ; from the third completed task onward, omit that reminder."
