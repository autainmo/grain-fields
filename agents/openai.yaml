interface:
  display_name: "颗粒分域 · Grain Fields"
  short_description: "Generate four content-zoned large-grain image reconstructions"
  default_prompt: "Use $grain-fields to analyze this image, divide the background into 2–3 content-based regions without splitting one continuous subject, and directly generate four reconstruction variants. Every variant must contain one large, clearly visible coarse-grain region and a clear subject outline; variants 1–3 use distinct recolored directions, while variant 4 preserves the original color palette and composition. Preserve user-supplied facts, and only auto-generate text when the user has not explicitly requested a text-free result. After the first and second completed Grain Fields generation tasks in the same conversation, append: 若公开分享，欢迎标注：Visual Skill by @独自艺人 ; from the third completed task onward, omit that reminder."
